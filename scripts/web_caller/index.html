<!doctype html>
<html><head><meta charset="utf-8"><title>Retell receptionist: live web call test</title>
<style>
 body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#0f1115;color:#e8e8e8;margin:0;padding:28px}
 h1{font-size:22px;margin:0 0 4px} .sub{color:#9aa3ad;font-size:14px;margin-bottom:18px}
 #status{display:inline-block;padding:4px 10px;border-radius:12px;background:#24303c;font-size:13px;margin-bottom:14px}
 .row{margin:8px 0;padding:10px 14px;border-radius:10px;max-width:900px;line-height:1.4;font-size:15px}
 .agent{background:#1d2a22;border-left:4px solid #3ecf8e}
 .user{background:#1f2433;border-left:4px solid #6c8cff}
 .who{font-size:12px;color:#9aa3ad;margin-bottom:2px}
</style></head>
<body>
<h1 id="title">Retell AI receptionist: live web call</h1>
<div class="sub" id="sub">Retell web call, Claude Sonnet 5.5 as the brain, custom functions on FastAPI. The caller is a scripted synthetic voice.</div>
<div id="status">idle</div>
<div id="log"></div>
<script type="module">
// The "microphone" is a Web Audio stream, so the test can speak pre-recorded caller lines.
window.__state = { speaking: false, lastSpeechEnd: 0, started: false, ended: false, error: null, gum: 0, transcript: [] };
const ctx = new AudioContext({ sampleRate: 48000 });
const dest = ctx.createMediaStreamDestination();
const silent = ctx.createConstantSource(); silent.offset.value = 0; silent.connect(dest); silent.start();
const fakeTrack = dest.stream.getAudioTracks()[0];
navigator.mediaDevices.getUserMedia = async () => { window.__state.gum++; return new MediaStream([fakeTrack.clone()]); };
// Import the SDK only after the override, so it never reaches a real microphone.
const { RetellWebClient } = await import("https://esm.sh/retell-client-js-sdk@3.0.3");

const log = document.getElementById("log"), status = document.getElementById("status");
function render(transcript) {
  log.innerHTML = "";
  for (const t of transcript) {
    const d = document.createElement("div"); d.className = "row " + (t.role === "agent" ? "agent" : "user");
    d.innerHTML = `<div class="who">${t.role === "agent" ? "RECEPTIONIST (AI)" : "CALLER (synthetic voice)"}</div>`;
    d.appendChild(document.createTextNode(t.content)); log.appendChild(d);
  }
}
const client = new RetellWebClient(); window.__client = client;
client.on("call_started", () => { __state.started = true; status.textContent = "call live"; });
client.on("call_ended", () => { __state.ended = true; status.textContent = "call ended"; });
client.on("agent_start_talking", () => { __state.speaking = true; });
client.on("agent_stop_talking", () => { __state.speaking = false; __state.lastSpeechEnd = Date.now(); });
// Talk state from the agent's own audio level (the gateway transport sends no talk events).
let lastLoud = 0;
client.on("audio", (samples) => {
  let sum = 0; for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
  const rms = Math.sqrt(sum / Math.max(1, samples.length));
  if (rms > 0.01) { lastLoud = Date.now(); if (!__state.speaking) { __state.speaking = true; } }
});
setInterval(() => { if (__state.speaking && Date.now() - lastLoud > 900) { __state.speaking = false; __state.lastSpeechEnd = Date.now(); } }, 100);
client.on("update", (u) => { if (u && u.transcript) { __state.transcript = u.transcript; render(u.transcript); } });
client.on("error", (e) => { __state.error = String(e?.message || JSON.stringify(e)); status.textContent = "error"; });
window.startCall = async (cfg) => { await ctx.resume(); await client.startCall({ accessToken: cfg.token, transport: cfg.transport, callId: cfg.callId, sampleRate: 48000, emitRawAudioSamples: true }); };
window.stopCall = () => client.stopCall();
window.setTitle = (t, s) => { document.getElementById("title").textContent = t; document.getElementById("sub").textContent = s; };
window.playClip = async (url) => {
  const ab = await ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
  const src = ctx.createBufferSource(); src.buffer = ab; src.connect(dest); src.start();
  await new Promise(r => src.onended = r);
};
window.__ready = true;
</script>
</body></html>
